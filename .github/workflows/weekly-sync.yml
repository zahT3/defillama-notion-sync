name: weekly-sync

# The weekly cron was removed on 2026-09-17. The scheduled runs had been failing
# because NOTION_TOKEN and NOTION_DATABASE_ID were never configured as repository
# secrets, and the Notion job shortlist this synced no longer had an active owner.
# Run it manually from the Actions tab if you decide to revive this.
on:
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python sync.py --verbose
